name: Duel League Cron

on:
  schedule:
    - cron: '*/30 * * * *'   # كل 30 دقيقة
  workflow_dispatch:          # تشغيل يدوي

# ما نسمح بتشغيلين بنفس الوقت (يمنع تكرار المكافآت)
concurrency:
  group: duel-league
  cancel-in-progress: false

jobs:
  duel-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install & Run
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          npm install firebase-admin
          node << 'EOFSCRIPT'
          const admin = require("firebase-admin");

          // ── الإعدادات ──────────────────────────────────────────
          const DAY = 24 * 3600 * 1000;
          const CYCLE_MS = DAY;                   // مدة دوري 1v1: 24 ساعة
          const PAUSE_MS = 6 * DAY;               // الاستراحة: 6 أيام
          const FIRST_PLACE_BONUS = 100;          // مكافأة الفائز بالدوري (الأكثر أكلاً بنهاية الـ24 ساعة)، والخاسر 0
          const GRACE_MS = 30 * 60 * 1000;        // مهلة بعد نهاية الدورة لتنتهي المباريات الجارية
          const TZ_OFFSET_MS = 3 * 3600 * 1000;   // توقيت بغداد (UTC+3)
          const ACTIVE_DAYS = 7;                  // نزوّج بس اللي فتح اللعبة خلال آخر 7 أيام

          // ── تهيئة Firebase (مع رسالة واضحة لو السر غلط) ──────────
          let serviceAccount;
          try {
            serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || "");
          } catch (e) {
            console.error('FIREBASE_SERVICE_ACCOUNT ليس JSON صحيح. الصق محتوى ملف مفتاح حساب الخدمة كامل (يبدأ بـ {"type": "service_account").');
            process.exit(1);
          }
          if (!serviceAccount.private_key || !process.env.FIREBASE_DB_URL) {
            console.error("ناقص: مفتاح حساب الخدمة أو FIREBASE_DB_URL");
            process.exit(1);
          }
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: process.env.FIREBASE_DB_URL
          });
          const db = admin.database();
          const inc = (n) => admin.database.ServerValue.increment(n);

          // ── أدوات الوقت ────────────────────────────────────────
          // آخر سبت الساعة 00:00 بتوقيت بغداد (بالمللي ثانية UTC)
          function lastSaturdayMidnight(nowMs) {
            const d = new Date(nowMs + TZ_OFFSET_MS);
            const diff = (d.getUTCDay() - 6 + 7) % 7;
            return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - diff) - TZ_OFFSET_MS;
          }
          // بداية الدورة: السبت الحالي إذا لسا داخل نافذة الـ24 ساعة، وإلا السبت الجاي
          function pickStart(nowMs) {
            const s = lastSaturdayMidnight(nowMs);
            return nowMs < s + CYCLE_MS ? s : s + 7 * DAY;
          }
          // streakData.lastDate يكون بصيغة "2026-9-20"
          function isActive(p, nowMs) {
            const ld = p.streakData && p.streakData.lastDate;
            if (!ld) return false;
            const [y, m, d] = String(ld).split("-").map(Number);
            const t = Date.UTC(y, m - 1, d);
            return !isNaN(t) && nowMs - t <= (ACTIVE_DAYS + 1) * DAY;
          }

          // ── 1) توزيع الخصوم (مرة وحدة لكل دورة) ─────────────────
          async function pairPlayers(nowMs) {
            const snap = await db.ref("players").once("value");
            const all = [];
            snap.forEach((s) => {
              const v = s.val() || {};
              all.push({ uid: s.key, name: v.name, photo: v.photo, hasOpp: !!v.duelOpp, active: isActive(v, nowMs) });
            });
            let pool = all.filter((p) => p.name && p.active);
            if (pool.length < 2) pool = all.filter((p) => p.name);   // لو ما فيه نشيطين كفاية نزوّج الكل
            for (let i = pool.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            const updates = {};
            const paired = new Set();
            for (let i = 0; i + 1 < pool.length; i += 2) {
              const a = pool[i], b = pool[i + 1];
              updates[`players/${a.uid}/duelOpp`] = { id: b.uid, name: b.name || "لاعب", photo: b.photo || "" };
              updates[`players/${b.uid}/duelOpp`] = { id: a.uid, name: a.name || "لاعب", photo: a.photo || "" };
              paired.add(a.uid); paired.add(b.uid);
            }
            // نصفّر نقاط الدورة وسجل المواجهات للمزوّجين، ونمسح الخصم القديم لغيرهم
            paired.forEach((uid) => {
              updates[`players/${uid}/duelSeasonPoints`] = 0;
              updates[`players/${uid}/duelSeasonWins`] = 0;
              updates[`duelMatches/${uid}`] = null;
            });
            all.forEach((p) => {
              if (!paired.has(p.uid) && p.hasOpp) updates[`players/${p.uid}/duelOpp`] = null;
            });
            if (Object.keys(updates).length) await db.ref().update(updates);
            console.log(`Paired ${paired.size / 2} duels`);
          }

          // ── 2) النقاط = عدد القطع المأكولة (كل لاعب بمبارياته الأونلاين، مو ضد خصمه) ──
          async function awardMatches(cycleStart, cycleEnd, nowMs) {
            const roomsSnap = await db.ref("rooms").orderByChild("created").startAt(cycleStart).once("value");
            const candidates = [];
            roomsSnap.forEach((s) => {
              const r = s.val() || {};
              const id = s.key;
              if (id.startsWith("friend_") || r.duelRewarded || typeof r.winner !== "string") return;
              if (!r.created || r.created > cycleEnd) return;
              const w = r.whiteUid || (r.white && r.white.uid), b = r.blackUid || (r.black && r.black.uid);
              if (!w || !b || w === b) return;
              candidates.push({ id, r, w, b });
            });
            if (!candidates.length) { console.log("No finished rooms to check"); return; }

            // نحسب بس للاعبين اللي عندهم خصم دوري هذا الأسبوع
            const playersSnap = await db.ref("players").once("value");
            const inDuel = {};
            playersSnap.forEach((s) => { const o = (s.val() || {}).duelOpp; inDuel[s.key] = !!(o && o.id); });

            const addPts = {}, updates = {};
            let count = 0;
            for (const { id, r, w, b } of candidates) {
              const side = String(r.winner).split("_")[0];             // white / black / draw
              if (side !== "white" && side !== "black" && side !== "draw") continue;
              const wCap = Number(r.whiteCaptures) || 0, bCap = Number(r.blackCaptures) || 0;
              const wRes = side === "draw" ? "draw" : (side === "white" ? "win" : "loss");
              const bRes = side === "draw" ? "draw" : (side === "black" ? "win" : "loss");
              // الفوز/الخسارة/الانسحاب ما يأثر: المهم عدد الأكلات فقط
              if (inDuel[w]) {
                addPts[w] = (addPts[w] || 0) + wCap;
                updates[`duelMatches/${w}/${id}`] = { ts: nowMs, oppUid: b, result: wRes, pieces: wCap };
              }
              if (inDuel[b]) {
                addPts[b] = (addPts[b] || 0) + bCap;
                updates[`duelMatches/${b}/${id}`] = { ts: nowMs, oppUid: w, result: bRes, pieces: bCap };
              }
              updates[`rooms/${id}/duelRewarded`] = true;
              count++;
            }
            Object.keys(addPts).forEach((u) => { updates[`players/${u}/duelSeasonPoints`] = inc(addPts[u]); });
            if (count) {
              await db.ref().update(updates);
              console.log(`Counted captures from ${count} matches`);
            }
          }

          // ── 3) نهاية الدورة: مكافأة الأول + عدّاد المراكز + بدء الاستراحة (بكتابة وحدة) ──
          async function finalizeCycle(nowMs) {
            const snap = await db.ref("players").once("value");
            const list = [];
            snap.forEach((s) => {
              const v = s.val() || {};
              list.push({ uid: s.key, opp: v.duelOpp && v.duelOpp.id, pts: v.duelSeasonPoints || 0, wins: v.duelSeasonWins || 0, cur: v.points || 0, max: v.maxPoints || 0 });
            });
            list.sort((a, b) => b.pts - a.pts || b.wins - a.wins || (a.uid < b.uid ? -1 : 1));
            const updates = {};
            const rankFields = ["rank1", "rank2", "rank3"];
            list.forEach((p, i) => {
              if (p.pts <= 0 || i > 2) return;
              updates[`players/${p.uid}/${rankFields[i]}`] = inc(1);
            });
            // مكافأة الفائز بدوري كل زوج: الأكثر أكلاً للقطع. الخاسر 0، والتعادل أو صفر أكلات = لا أحد
            const byUid = {};
            list.forEach((p) => { byUid[p.uid] = p; });
            const seen = new Set();
            list.forEach((p) => {
              const o = p.opp && byUid[p.opp];
              if (!o || seen.has(p.uid)) return;
              seen.add(p.uid); seen.add(o.uid);
              if (p.pts <= 0 && o.pts <= 0) return;
              if (p.pts === o.pts) return;                 // تعادل بالأكلات = ما أحد ياخذ المكافأة
              const top = p.pts > o.pts ? p : o;
              updates[`players/${top.uid}/points`] = inc(FIRST_PLACE_BONUS);
              updates[`players/${top.uid}/maxPoints`] = Math.max(top.max, top.cur + FIRST_PLACE_BONUS);
            });
            updates["duelCycle/waitStart"] = nowMs;   // بنفس الكتابة عشان ما تتكرر المكافأة لو انقطع التشغيل
            await db.ref().update(updates);
            console.log("Cycle finalized, pause started");
          }

          // ── المشغّل الرئيسي ────────────────────────────────────
          async function main() {
            const now = Date.now();
            const cycleRef = db.ref("duelCycle");
            let c = (await cycleRef.once("value")).val() || {};

            if (!c.start) {
              c = { start: pickStart(now), waitStart: null, pairedStart: null };
              await cycleRef.set(c);
              console.log("Initialized duel cycle:", new Date(c.start).toISOString());
            }
            if (c.waitStart && now >= c.waitStart + PAUSE_MS) {
              c = { start: pickStart(now), waitStart: null, pairedStart: null };
              await cycleRef.set(c);
              console.log("New duel cycle:", new Date(c.start).toISOString());
            }
            if (c.waitStart) { console.log("Pause phase"); return; }
            if (now < c.start) { console.log("Cycle has not started yet"); return; }

            const cycleEnd = c.start + CYCLE_MS;
            if (c.pairedStart !== c.start) {
              await pairPlayers(now);
              await cycleRef.update({ pairedStart: c.start });
            }
            await awardMatches(c.start, cycleEnd, now);
            if (now >= cycleEnd + GRACE_MS) await finalizeCycle(now);
          }

          main().then(() => { console.log("Done"); process.exit(0); })
                .catch((err) => { console.error("Failed:", err && err.message ? err.message : err); process.exit(1); });
          EOFSCRIPT
  
